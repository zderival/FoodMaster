name: FoodMaster

on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: food_master
          MYSQL_ROOT_PASSWORD: ${{  secrets.MYSQL_PASSWORD  }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name:  run tests
        env:
            MYSQL_Username: root
            MYSQL_Password: ${{ secrets.MYSQL_PASSWORD }}
            spoonacualr_api_key: ${{ secrets.SPOONACULAR_API_KEY }}
            gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
            jwt_key: ${{ secrets.JWT_SECRET }}
            SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/food_master
        run: mvn test