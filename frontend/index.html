<h1> FoodMaster </h1>
<input type= "text" id="enter-ingredients-box">
<label for="enter-ingredients-box"></label>

<button id="search_button"> Enter</button>
<div id="recipe-results">

</div>

<p id="search_button_text"></p>

<script>
    // asks the page for an element with that id.
    document.getElementById("search_button").addEventListener("click", function() {
    const userInput = document.getElementById("enter-ingredients-box").value
    const userInputSplit = userInput.split(",")
    const userInputTrim = userInputSplit.map(function(n){return n.trim()})
    console.log(userInputTrim)
    getRecipes(userInputTrim)
    document.getElementById("search_button_text").textContent= userInput;
    
    });

    async function getRecipes(userInputTrim) {
    const recipeResults = document.getElementById("recipe-results")
    recipeResults.textContent = "Loading..."
    console.log("getRecipes ran")
    const response = await fetch("http://localhost:8080/recipes/search", {
    method: "POST",
    headers: {"Content-Type": "application/json" },
    body: JSON.stringify({"ingredients": userInputTrim})
        });
    const data = await response.json();
    const filterRecipes = data.filter(function(n){return recipeHasALLIngredient(n,userInputTrim)})
    recipeResults.textContent = ""
    if(filterRecipes.length === 0){
        recipeResults.textContent = "We couldn't find a recipe with all those ingredients. Edit your list and search again."
    }
    console.log(response.status,data)
    console.log(filterRecipes)
    }

    function ingredientMatch(ingredientName,userIngredient){
            const ingredientNameSplit = ingredientName.toLowerCase().split(" ")
            const userIngredientLower = userIngredient.toLowerCase()
            return ingredientNameSplit.includes(userIngredientLower)
        }
    

    function recipeHasIngredient(recipe, typedWord){
        const ingredients = recipe.ingredients;
        return ingredients.some(function(n){return ingredientMatch(n.name,typedWord)})
    }

     function recipeHasALLIngredient(recipe, listWords){
        return listWords.every(function(n){return recipeHasIngredient(recipe,n)})
        }

</script>
